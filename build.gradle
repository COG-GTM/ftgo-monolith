import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id "org.springframework.boot" version "${springBootVersion}" apply false
    id "io.spring.dependency-management" version "${springDependencyManagementPluginVersion}" apply false
    id "com.github.ben-manes.versions" version "0.51.0"
}

apply plugin: WaitForMySqlPlugin

subprojects {

    apply plugin: "java-library"
    apply plugin: "io.spring.dependency-management"

    group = "net.chrisrichardson.ftgo"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()

        maven {
            url "${project.rootDir}/build/repo"
        }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
        dependencies {
            // Override the BOM-managed commons-lang3 (3.17.0) to pick up the fix
            // for CVE-2025-48924 (uncontrolled recursion), resolved in 3.18.0.
            dependency "org.apache.commons:commons-lang3:3.18.0"
        }
    }

    dependencies {
        // Align the JUnit Platform launcher with the BOM-managed engine; Gradle
        // bundles an older launcher which fails test discovery on newer JUnit.
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-parameters")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
