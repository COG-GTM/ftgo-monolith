buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:${springDependencyManagementPluginVersion}"
    }
}

plugins {
    id "com.github.ben-manes.versions" version "0.51.0"
}

apply plugin: WaitForMySqlPlugin

subprojects {

    apply plugin: "java-library"
    apply plugin: "io.spring.dependency-management"

    group = "net.chrisrichardson.ftgo"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    dependencies {
        // Existing tests are written against JUnit 4; run them on the JUnit Platform
        // via the vintage engine (no longer bundled with spring-boot-starter-test).
        // Declared as an api/impl dependency so the JUnit 4 API is also on the test
        // compile classpath.
        testImplementation "org.junit.vintage:junit-vintage-engine"
    }

    tasks.withType(JavaCompile).configureEach {
        // Spring 6 / Boot 3 resolves @PathVariable/@RequestParam names from the
        // compiled parameter names; retain them as Boot 2's plugin did by default.
        options.compilerArgs.add("-parameters")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

}
