buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagementPluginVersion"
    }

    apply plugin: WaitForMySqlPlugin
}

plugins {
    id "com.github.ben-manes.versions" version "0.20.0"
}


subprojects {

    apply plugin: "java"
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    group = "net.chrisrichardson.ftgo"

    // Override the Spring Boot BOM's managed Jackson version so the patched 2.9.10
    // line is used everywhere the dependency-management plugin is applied (e.g. the
    // deployable ftgo-application), instead of the BOM default that would otherwise
    // pull Jackson back down to the vulnerable version on transitive resolution.
    ext['jackson.version'] = '2.9.10'

    // jackson-databind has its own patch line (2.9.10.x) beyond the shared jackson
    // version; force the fully-patched build in the dependency-managed modules too.
    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            dependencies {
                dependency 'com.fasterxml.jackson.core:jackson-databind:2.9.10.8'
            }
        }
    }

    repositories {
        mavenCentral()
        jcenter()

        // Commenting out problematic repositories that require authentication or are no longer available
        // eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }

        // maven {
        //     url 'https://repo.spring.io/libs-milestone'
        // }

        maven {
            url "${project.rootDir}/build/repo"
        }

    }

}
