buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Boot + dependency-management plugins live on the buildscript classpath so that
        // buildSrc's FtgoServicePlugin can `apply plugin: 'org.springframework.boot'` by id.
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagementPluginVersion"
    }

    apply plugin: WaitForMySqlPlugin
}

plugins {
    // `./gradlew dependencyUpdates` report; Gradle 8 compatible release.
    id "io.github.ben-manes.versions" version "0.60.0"
}


subprojects {

    // java-library gives every module the api/implementation configurations that
    // replaced Gradle 4's compile/runtime.
    apply plugin: "java-library"
    // Import the Boot BOM everywhere (not only in modules that apply the Boot plugin)
    // so third-party versions (Jackson, MySQL driver, JUnit, Micrometer...) are managed centrally.
    apply plugin: "io.spring.dependency-management"

    group = "net.chrisrichardson.ftgo"

    // Compile and run on JDK 21; the foojay resolver in settings.gradle downloads it if needed.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()

        maven {
            url = "${project.rootDir}/build/repo"
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    // Spring Boot 3 ships JUnit 5 (Jupiter) via spring-boot-starter-test; run tests on the JUnit Platform.
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
