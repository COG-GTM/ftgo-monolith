buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
        classpath "io.spring.gradle:dependency-management-plugin:$springDependencyManagementPluginVersion"
    }

    apply plugin: WaitForMySqlPlugin
}

plugins {
    id "com.github.ben-manes.versions" version "0.20.0"
}


subprojects {

    apply plugin: "java"
    // Java 10 migration: bytecode/source level for all modules
    sourceCompatibility = '10'
    targetCompatibility = '10'

    // Gradle 5.6.4's incremental-compile class analyser crashes with
    // "Multiple entries with same key" on jars that contain duplicate class
    // entries (commons-lang, javassist via springfox). Full recompilation
    // avoids the analyser; drop this once Gradle is on 6.x+.
    tasks.withType(JavaCompile) {
        options.incremental = false
    }

    group = "net.chrisrichardson.ftgo"

    repositories {
        mavenCentral()
        jcenter()

        // Commenting out problematic repositories that require authentication or are no longer available
        // eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }

        // maven {
        //     url 'https://repo.spring.io/libs-milestone'
        // }

        maven {
            url "${project.rootDir}/build/repo"
        }

    }

}
