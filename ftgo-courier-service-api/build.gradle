dependencies {
    // Request/response DTOs for the courier service; shared value objects (PersonName, Address)
    // and the Jackson/JPA starters come transitively from ftgo-common via the `api` configuration.
    api project(":ftgo-common")

    // JUnit 5 (Jupiter) + AssertJ from the Boot BOM for the DTO JSON round-trip tests.
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    // Gradle 8 no longer injects its own launcher; a BOM-aligned launcher version is required so it
    // matches the junit-platform-engine pulled in by spring-boot-starter-test.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}