dependencies {
    // JUnit 5 (Jupiter) assertions used by FtgoTestUtil. Exposed on `api` so service test
    // suites that depend on this module get the Jupiter API transitively.
    // Version is managed by the Spring Boot BOM imported in the root build.
    api "org.junit.jupiter:junit-jupiter"

    // JUnit 4 stays on the `api` classpath for downstream service tests that still import
    // org.junit.Test / org.junit.Assert. Remove once every consumer has moved to Jupiter.
    api "junit:junit"

    // Gradle 8 no longer puts the JUnit Platform launcher on the test runtime classpath
    // automatically; declare it so this module's own Jupiter tests can run.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
