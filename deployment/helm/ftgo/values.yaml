nameOverride: ""
fullnameOverride: ""

app:
  replicaCount: 1

  # Not published to a registry: build it and load it into the cluster first
  # (kind: `kind load docker-image ftgo-application:<tag>`), or point repository/tag at a registry image.
  image:
    repository: ftgo-application
    # Defaults to .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  javaOpts: "-Xmx192m"

  # Query string appended to the JDBC URL. Empty picks a default: "useSSL=false&allowPublicKeyRetrieval=true"
  # for the in-chart MySQL (no CA-signed cert), "sslMode=REQUIRED" for externalDatabase.
  # For a real database prefer e.g. "sslMode=VERIFY_IDENTITY" with a truststore.
  jdbcParams: ""

  # Extra non-secret environment variables, rendered into the app ConfigMap.
  extraConfig: {}

  service:
    type: ClusterIP
    port: 8080
    # Only used when type is NodePort.
    nodePort: null

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 512Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 36
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 6

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migrations:
  enabled: true
  # initContainer: `flyway migrate` runs before the app container in every app pod, so pods only go Ready
  #   on a migrated schema (Flyway's schema-history lock serialises concurrent replicas).
  # hook: a Job runs once per release as a post-install / pre-upgrade hook instead. On a fresh install the app
  #   starts alongside MySQL and the Job migrates afterwards (pre-install can't be used: the in-chart MySQL and DB
  #   Secret don't exist yet); on upgrade a failed Job fails the release before the new app pods roll out.
  mode: initContainer

  # Built from ftgo-flyway/Dockerfile (flyway/flyway + the SQL in ftgo-flyway/src/main/resources/db/migration).
  # Not published to a registry: `scripts/build-images.sh --kind-load` builds and loads it with the app image.
  image:
    repository: ftgo-flyway
    # Defaults to .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent

  # Hook Job only; in initContainer mode the app pod's imagePullSecrets apply.
  imagePullSecrets: []

  # Flyway waits for the database: up to connectRetries attempts, connectRetriesInterval seconds apart.
  connectRetries: 60
  connectRetriesInterval: 5

  javaArgs: "-Xmx128m"

  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

  # Used by the hook Job; in initContainer mode the app pod's podSecurityContext applies.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  job:
    backoffLimit: 0
    activeDeadlineSeconds: 900

mysql:
  # Set to false to use externalDatabase instead of the in-chart StatefulSet.
  enabled: true

  image:
    repository: mysql
    tag: "8.0.39"
    pullPolicy: IfNotPresent

  auth:
    # Must match files/schema.sql (symlink to mysql/schema.sql), which creates the database and grants the user.
    database: ftgo
    username: mysqluser
    # Leave empty to generate random passwords on first install; they are then reused on upgrade.
    # MySQL only applies these when it initialises an empty volume, so once the Secret exists a different
    # value fails the install/upgrade instead of silently diverging from the database.
    rootPassword: ""
    password: ""
    # Name of an existing Secret with keys `mysql-root-password`, `mysql-user` and `mysql-password`.
    existingSecret: ""

  service:
    port: 3306

  persistence:
    size: 1Gi
    # Empty uses the cluster default StorageClass (kind: `standard`).
    storageClass: ""
    accessModes: ["ReadWriteOnce"]

  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

  podSecurityContext:
    fsGroup: 999

  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 60
    readiness:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used when mysql.enabled is false.
externalDatabase:
  host: ""
  port: 3306
  database: ftgo
  username: ""
  password: ""
  # Name of an existing Secret with keys `mysql-user` and `mysql-password`.
  existingSecret: ""
