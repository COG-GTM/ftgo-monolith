apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ftgo.app.fullname" . }}
  labels:
    {{- include "ftgo.app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  revisionHistoryLimit: {{ .Values.app.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.app.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.app.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ftgo.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ftgo.app.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/app-configmap.yaml") . | sha256sum }}
        {{- with omit .Values.app.podAnnotations "checksum/config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      {{- if and .Values.migrations.enabled (eq .Values.migrations.mode "initContainer") }}
      initContainers:
        {{- include "ftgo.migrations.container" . | nindent 8 }}
      {{- end }}
      containers:
        - name: ftgo-application
          image: {{ include "ftgo.app.image" . | quote }}
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ftgo.app.fullname" . }}
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ftgo.db.secretName" . }}
                  key: mysql-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ftgo.db.secretName" . }}
                  key: mysql-password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            {{- toYaml .Values.app.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            {{- toYaml .Values.app.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            {{- toYaml .Values.app.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
