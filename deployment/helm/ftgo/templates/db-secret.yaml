{{- if include "ftgo.db.createSecret" . }}
{{- $name := include "ftgo.db.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ftgo.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "mysql" "external-db" .Values.mysql.enabled }}
  annotations:
    # Survives `helm uninstall` together with the MySQL PVC, so a reinstall still matches the data on disk.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if .Values.mysql.enabled }}
  mysql-root-password: {{ .Values.mysql.auth.rootPassword | b64enc | default (get $existing "mysql-root-password") | default (randAlphaNum 24 | b64enc) | quote }}
  mysql-user: {{ .Values.mysql.auth.username | b64enc | quote }}
  mysql-password: {{ .Values.mysql.auth.password | b64enc | default (get $existing "mysql-password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- else }}
  mysql-user: {{ required "externalDatabase.username is required when mysql.enabled=false and externalDatabase.existingSecret is empty" .Values.externalDatabase.username | b64enc | quote }}
  mysql-password: {{ required "externalDatabase.password is required when mysql.enabled=false and externalDatabase.existingSecret is empty" .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- end }}
