# Single-node kind cluster for the FTGO Helm chart (make kind-up).
# Host 127.0.0.1:8081 maps to NodePort 30081, which values-kind.yaml assigns to the app Service,
# so http://localhost:8081 works without kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ftgo
nodes:
  - role: control-plane
    # Node image published with kind v0.24.0.
    image: kindest/node:v1.31.0@sha256:53df588e04085fd41ae12de0c3fe4c72f7013bba32a20e7325357a1ac94ba865
    extraPortMappings:
      - containerPort: 30081
        hostPort: 8081
        listenAddress: "127.0.0.1"
        protocol: TCP
