spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
spring.flyway.enabled=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Each service owns a schema on the same MySQL server and reuses the spring.datasource
# credentials. spring.datasource itself holds the API tracking log (ftgo schema).
ftgo.consumer-service.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_consumer?useSSL=false&allowPublicKeyRetrieval=true
ftgo.restaurant-service.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_restaurant?useSSL=false&allowPublicKeyRetrieval=true
ftgo.courier-service.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_courier?useSSL=false&allowPublicKeyRetrieval=true
ftgo.order-service.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_order?useSSL=false&allowPublicKeyRetrieval=true

sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:demo}
sentry.send-default-pii=true
