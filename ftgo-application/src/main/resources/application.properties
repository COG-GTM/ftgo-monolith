spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
# Hibernate 6 (Spring Boot 3) defaults @GeneratedValue to per-entity "<table>_seq"
# tables. Use the legacy naming strategy so the existing shared "hibernate_sequence"
# table continues to be used, preserving the pre-upgrade schema and behavior.
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=legacy
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
