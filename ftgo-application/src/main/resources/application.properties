spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Shared token that restaurant/courier operators must send in the X-Ftgo-Staff-Token header
# to drive order lifecycle transitions. When it is empty those endpoints reject every request.
ftgo.staff.api-token=${FTGO_STAFF_API_TOKEN:}
