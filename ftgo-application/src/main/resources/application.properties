spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

ftgo.security.api.username=${FTGO_API_USERNAME:}
ftgo.security.api.password=${FTGO_API_PASSWORD:}
ftgo.security.operator.username=${FTGO_OPERATOR_USERNAME:}
ftgo.security.operator.password=${FTGO_OPERATOR_PASSWORD:}
