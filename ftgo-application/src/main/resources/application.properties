spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Retention window for courier live location (current_latitude/current_longitude/last_location_update).
# Positions older than this are purged. PLACEHOLDER pending compliance sign-off on the approved window.
ftgo.courier.location.retention=PT24H
ftgo.courier.location.purge-interval-ms=60000
