spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Per-role API keys for privileged order lifecycle endpoints. Unset roles cannot authenticate.
ftgo.security.api-keys.restaurant=${FTGO_RESTAURANT_API_KEY:}
ftgo.security.api-keys.courier=${FTGO_COURIER_API_KEY:}
ftgo.security.api-keys.operator=${FTGO_OPERATOR_API_KEY:}
