spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=DEBUG
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Identities allowed to call /orders/** (HTTP Basic). OPERATIONS may act on any order; a CONSUMER
# user is bound to its consumerId and may only see/modify that consumer's orders.
# The defaults below are for local development only - override them (or supply {bcrypt} hashes) in
# real deployments, e.g. FTGO_OPERATIONS_USERNAME / FTGO_OPERATIONS_PASSWORD.
ftgo.security.users[0].username=${FTGO_OPERATIONS_USERNAME:operations}
ftgo.security.users[0].password=${FTGO_OPERATIONS_PASSWORD:operations-dev-password}
ftgo.security.users[0].roles=OPERATIONS
# Spring Boot binds the users[] list from a single property source, so when adding users via the
# command line / env you must also restate users[0] there. Example consumer identity:
# ftgo.security.users[1].username=alice
# ftgo.security.users[1].password=alice-pw
# ftgo.security.users[1].roles=CONSUMER
# ftgo.security.users[1].consumerId=1
