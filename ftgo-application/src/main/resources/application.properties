spring.application.name=ftgo-application

spring.jpa.generate-ddl=false
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo?sslMode=${FTGO_DB_SSL_MODE:REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mysqluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysqlpw}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
