apply plugin: FtgoServicePlugin

dependencies {
    implementation project(":ftgo-consumer-service")
    implementation project(":ftgo-order-service")
    implementation project(":ftgo-restaurant-service")
    implementation project(":ftgo-courier-service")

    implementation libs.spring.actuator
    implementation libs.spring.web

    runtimeOnly libs.mysql

    testImplementation project(":ftgo-end-to-end-tests-common")
}
tasks.named('bootJar') { archiveFileName = 'ftgo-application.jar' }

processTestResources {
    from("${rootDir}/docs/upgrade/java21/golden") {
        into 'golden'
    }
}

tasks.named('test') {
    systemProperty 'user.timezone', providers.gradleProperty('testTimeZone').getOrElse('UTC')
}
