name: Dependency vulnerability scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      # Submits the resolved Gradle dependency graph so GitHub Dependabot alerts cover every resolved artifact.
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enforce dependency hygiene (no sunset repositories, supported Spring Boot)
        run: ./gradlew verifyDependencyRepositories

  dependency-review:
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
