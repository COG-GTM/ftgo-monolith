name: Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ftgo
          MYSQL_USER: mysqluser
          MYSQL_PASSWORD: mysqlpw
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DOCKER_HOST_IP: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootpassword --silent; then
              echo "MySQL is up"; exit 0
            fi
            echo "Waiting for MySQL..."; sleep 3
          done
          echo "MySQL did not become available in time" && exit 1

      - name: Apply Flyway database migrations
        run: ./gradlew :ftgo-flyway:flywayMigrate

      - name: Build and test (JDK 21)
        run: ./gradlew -x :ftgo-end-to-end-tests:test build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
