# Only loaded when running standalone via RestaurantServiceMain (spring.config.name=restaurant-service).
spring.application.name=ftgo-restaurant-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DOCKER_HOST_IP:localhost}/ftgo_restaurant?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpw
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/restaurant-service/migration
spring.flyway.table=restaurant_service_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.service=${spring.application.name}

logging.config=classpath:net/chrisrichardson/ftgo/common/logging/logback-json.xml
