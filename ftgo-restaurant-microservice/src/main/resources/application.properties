spring.application.name=ftgo-restaurant-microservice

# Unique port so the microservice can run alongside the monolith (8081)
server.port=${SERVER_PORT:8082}

# Standalone in-memory H2 database; DB_CLOSE_DELAY=-1 keeps data for the JVM lifetime
spring.datasource.url=jdbc:h2:mem:ftgo_restaurant;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema is owned by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway migrations create the restaurant tables on startup
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 web console for debugging at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.hibernate.SQL=DEBUG
