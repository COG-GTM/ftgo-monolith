plugins {
    id "org.flywaydb.flyway" version "6.0.0"
}

flyway {
    url = "jdbc:mysql://${System.getenv('DOCKER_HOST_IP') ?: 'localhost'}/ftgo?useSSL=true&requireSSL=true&verifyServerCertificate=false"
    user = System.getenv('FLYWAY_DB_USER') ?: 'root'
    password = System.getenv('FLYWAY_DB_PASSWORD')
    schemas = ['ftgo']
}
