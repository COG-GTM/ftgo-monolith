buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-mysql:11.10.0"
        classpath "com.mysql:mysql-connector-j:9.3.0"
    }
}

plugins {
    id "org.flywaydb.flyway" version "11.10.0"
}

flyway {
    url = "jdbc:mysql://${System.getenv('DOCKER_HOST_IP') ?: 'localhost'}/ftgo?useSSL=false"
    user = 'root'
    password = 'rootpassword'
    schemas = ['ftgo']
}
