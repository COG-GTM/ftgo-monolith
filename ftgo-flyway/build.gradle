plugins {
    id "org.flywaydb.flyway" version "6.0.0"
}

flyway {
    url = "jdbc:mysql://${System.getenv('DOCKER_HOST_IP') ?: 'localhost'}/ftgo?useSSL=true&requireSSL=true&verifyServerCertificate=${System.getenv('DB_VERIFY_SERVER_CERTIFICATE') ?: 'false'}"
    user = System.getenv('FLYWAY_DB_USER') ?: 'root'
    password = System.getenv('FLYWAY_DB_PASSWORD') ?: System.getenv('MYSQL_ROOT_PASSWORD')
    schemas = ['ftgo']
}
