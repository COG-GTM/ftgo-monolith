spring.application.name=ftgo-consumer-service

server.port=8082

# Own database: H2 in-memory, owned solely by the Consumer service.
spring.datasource.url=jdbc:h2:mem:consumer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema is managed by Flyway, never by Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info

logging.level.org.hibernate.SQL=DEBUG
