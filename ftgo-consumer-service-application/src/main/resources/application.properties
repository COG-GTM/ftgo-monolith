spring.application.name=ftgo-consumer-service

server.port=8082

# H2 in-memory database. DB_CLOSE_DELAY=-1 keeps the schema/data alive for the
# lifetime of the JVM even when no connection is open.
spring.datasource.url=jdbc:h2:mem:consumerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is owned by Flyway, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=false
logging.level.org.hibernate.SQL=DEBUG

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 web console for debugging at http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
