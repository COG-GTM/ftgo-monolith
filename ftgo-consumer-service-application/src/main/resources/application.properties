spring.application.name=ftgo-consumer-service

server.port=8082

# H2 in-memory database (DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the JVM lifetime)
spring.datasource.url=jdbc:h2:mem:ftgo_consumer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema is managed by Flyway, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 console for debugging at /h2-console
spring.h2.console.enabled=true

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
