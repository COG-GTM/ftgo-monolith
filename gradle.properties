# Shared dependency/plugin versions for the whole multi-project build.
# Anything managed by the Spring Boot BOM (Jackson, Micrometer, JUnit, MySQL driver,
# Hibernate, ...) is intentionally NOT pinned here; the BOM owns those versions.

# Spring Boot 3.5.x GA line (Java 21, Jakarta EE 10, Hibernate 6, JUnit 5).
springBootVersion=3.5.16
# io.spring.dependency-management plugin that imports the Boot BOM into every module.
springDependencyManagementPluginVersion=1.1.7

# io.rest-assured 5.x replaces the legacy com.jayway.restassured coordinates.
restAssuredVersion=5.5.7
# springdoc-openapi 2.x replaces springfox for Swagger/OpenAPI UI on Boot 3.
springdocVersion=2.8.17
# Flyway 10.x (Gradle plugin + flyway-mysql database module).
flywayVersion=10.22.0

# Eventuate test utilities used by the end-to-end tests (Eventually/polling helpers).
# 0.1.0.RELEASE only existed on the defunct Bintray repo; 0.19.0.RELEASE is on Maven Central
# and is built for JUnit Jupiter.
eventuateUtilVersion=0.19.0.RELEASE

# Gradle JVM settings: Gradle 8 + Java 21 toolchains need a little more heap than the 4.x defaults.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
