dependencies {


    api project(":common-swagger")
    api project(":ftgo-domain")

    api project(":ftgo-consumer-service-api")
    api project(":ftgo-restaurant-service-api")
    api project(":ftgo-order-service-api")
    api project(":ftgo-consumer-service")

    api "org.springframework.boot:spring-boot-starter-data-jpa"
    api "org.springframework.boot:spring-boot-starter-actuator"
    // Micrometer version is managed by the Spring Boot BOM.
    api "io.micrometer:micrometer-registry-prometheus"
    api "org.springframework.boot:spring-boot-starter-web"
    // Bean Validation (Hibernate Validator + Jakarta EL) replaces the old javax.el-api dependency.
    api "org.springframework.boot:spring-boot-starter-validation"

    testImplementation "org.springframework.boot:spring-boot-starter-test"

    // REST Assured 5.x (io.rest-assured) replaces the legacy com.jayway.restassured 3.x coordinates;
    // spring-mock-mvc drives OrderController through a standalone MockMvc in the unit tests.
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    testImplementation "io.rest-assured:spring-mock-mvc:$restAssuredVersion"
    testImplementation "io.rest-assured:json-path:$restAssuredVersion"

    testImplementation project(":ftgo-test-util")

    // Gradle 8 no longer adds the JUnit Platform launcher to the test runtime classpath;
    // without it the Jupiter engine cannot discover tests (unaligned launcher/engine versions).
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
