dependencies {


    compile project(":common-swagger")
    compile project(":ftgo-domain")

    compile project(":ftgo-consumer-service-api")
    compile project(":ftgo-restaurant-service-api")
    compile project(":ftgo-order-service-api")
    compile project(":ftgo-consumer-service")

    compile "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    compile "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    compile "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
    compile 'javax.el:javax.el-api:2.2.5'

    testCompile "org.springframework.boot:spring-boot-starter-test:$springBootVersion"

    testCompile 'io.rest-assured:rest-assured:3.0.6'
    testCompile 'io.rest-assured:spring-mock-mvc:3.0.6'
    testCompile "io.rest-assured:json-path:3.0.6"

    testCompile project(":ftgo-test-util")

    integrationTestCompile "org.testcontainers:mysql:$testcontainersVersion"
    integrationTestRuntime "org.flywaydb:flyway-core:5.0.7"
}

// Integration tests build the schema from the real Flyway migrations
sourceSets.integrationTest.resources.srcDir "${rootDir}/ftgo-flyway/src/main/resources"

integrationTest {
    shouldRunAfter test
    systemProperty "ftgo.it.mysql.image", System.getProperty("ftgo.it.mysql.image", "mysql:5.7")
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}
