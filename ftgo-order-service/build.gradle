// apply plugin: 'docker-compose'
apply plugin:'io.spring.dependency-management'

apply plugin: IntegrationTestsPlugin

// Spring Framework 6.1 dropped bytecode-based parameter name discovery; keep method parameter
// names in the class files (as the Spring Boot Gradle plugin would do) so Spring MVC and
// Spring Data can still resolve @PathVariable/@RequestParam/@Param names by reflection.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-parameters"
}

