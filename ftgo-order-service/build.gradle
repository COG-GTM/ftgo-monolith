apply plugin: IntegrationTestsPlugin

dependencies {
    api project(":common-swagger")
    api project(":ftgo-domain")

    api project(":ftgo-consumer-service-api")
    api project(":ftgo-restaurant-service-api")
    api project(":ftgo-order-service-api")
    api project(":ftgo-consumer-service")

    api "org.springframework.boot:spring-boot-starter-data-jpa"
    api "org.springframework.boot:spring-boot-starter-actuator"
    api "io.micrometer:micrometer-registry-prometheus"
    api "org.springframework.boot:spring-boot-starter-web"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.junit.vintage:junit-vintage-engine"

    testImplementation "io.rest-assured:rest-assured"
    testImplementation "io.rest-assured:spring-mock-mvc"
    testImplementation "io.rest-assured:json-path"

    testImplementation project(":ftgo-test-util")
}
