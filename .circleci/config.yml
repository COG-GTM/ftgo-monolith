version:               2
jobs:
  build:
    machine:
      image:           ubuntu-2004:2024.01.1
    working_directory: ~/ftgo-monolith
    steps:
      - checkout
      - run:
          name:        Select Java 8 (required by Gradle 4.10.2)
          command:     |
            if [ ! -d /usr/lib/jvm/java-8-openjdk-amd64 ]; then
              sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-8-jdk-headless
            fi
            echo 'export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$PATH"' >> "$BASH_ENV"
            . "$BASH_ENV"
            java -version
      - restore_cache:
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      - run:           TERM=dumb ./gradlew testClasses
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.m2
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      - run:
          command:     |
            ./.circleci/upgrade-docker-compose.sh
            . ./setenv-circle-ci.sh
            ./build-and-test-all.sh
      - run:
          name:        Save test results
          command:     |
            mkdir -p ~/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/junit/ \;
          when:        always
      - store_test_results:
          path:        ~/junit
      - store_artifacts:
          path:        ~/junit
