version:               2
jobs:
  build:
    machine:           true
    working_directory: ~/ftgo-monolith
    steps:
      - checkout
      - restore_cache:
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      # The machine image defaults to Java 8; install and select JDK 10 before
      # any Gradle invocation. JAVA_HOME/PATH are exported via $BASH_ENV.
      - run:
          name:        Install JDK 10
          command:     ./.circleci/install-jdk10.sh
      - run:           TERM=dumb ./gradlew testClasses
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.m2
            # Cache the extracted JDK so later builds skip the download.
            - ~/jdk-10.0.2
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      - run:
          command:     |
            ./.circleci/upgrade-docker-compose.sh
            . ./setenv-circle-ci.sh
            ./build-and-test-all.sh
      - run:
          name:        Save test results
          command:     |
            mkdir -p ~/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/junit/ \;
          when:        always
      - store_test_results:
          path:        ~/junit
      - store_artifacts:
          path:        ~/junit
