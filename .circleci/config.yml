version:               2
jobs:
  build:
    machine:           true
    working_directory: ~/ftgo-monolith
    steps:
      - checkout
      - restore_cache:
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      - run:           TERM=dumb ./gradlew testClasses
      - save_cache:
          paths:
            - ~/.gradle
            - ~/.m2
          key:         ftgo-monolith-{{ checksum "gradle.properties" }}
      - run:
          command:     |
            ./.circleci/upgrade-docker-compose.sh
            . ./setenv-circle-ci.sh
            ./build-and-test-all.sh
      - run:
          name:        Save test results
          command:     |
            mkdir -p ~/junit/
            find . -type f -regex ".*/build/test-results/.*xml" -exec cp {} ~/junit/ \;
          when:        always
      - store_test_results:
          path:        ~/junit
      - store_artifacts:
          path:        ~/junit
  semgrep:
    docker:
      - image:     semgrep/semgrep:1.86.0
    working_directory: ~/ftgo-monolith
    steps:
      - checkout
      - run:
          name:        Semgrep (fails on ERROR severity)
          command:     semgrep scan --metrics=off --config p/java --config p/javascript --config p/secrets --config p/dockerfile --severity ERROR --error .
  snyk:
    docker:
      - image:     cimg/openjdk:8.0
    working_directory: ~/ftgo-monolith
    steps:
      - checkout
      - run:
          name:        Snyk Open Source (fails on critical issues not ignored in .snyk)
          command:     |
            if [ -z "$SNYK_TOKEN" ]; then echo "SNYK_TOKEN not set in the security-scanning context; skipping Snyk"; exit 0; fi
            curl -sSfL -o snyk https://static.snyk.io/cli/v1.1309.0/snyk-linux
            chmod +x snyk
            ./snyk test --all-sub-projects --policy-path=.snyk --severity-threshold=critical
workflows:
  version:         2
  build-and-scan:
    jobs:
      - build
      - semgrep
      - snyk:
          context: security-scanning
          filters:
            branches:
              only: master
