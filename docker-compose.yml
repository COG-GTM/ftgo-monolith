version: '3'
services:
  mysql:
    build: ./mysql
    # Publish 3306 on loopback only by default so the database is not reachable
    # on the host's external interfaces. MYSQL_HOST also drives the host-side
    # build tooling (waitForMySql, flywayMigrate, mysql-cli) so the bind address
    # and the address the tooling connects to always match. Override MYSQL_HOST
    # for remote-Docker setups; do not publish 3306 at all in shared envs.
    ports:
      - "${MYSQL_HOST:-127.0.0.1}:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # Username is fixed to match the account granted in mysql/schema.sql; only
      # the passwords are secrets and come from .env.
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
  ftgo-application:
    build: ./ftgo-application
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/ftgo
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EVENTUATELOCAL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTUATELOCAL_ZOOKEEPER_CONNECTION_STRING: zookeeper:2181
      JAVA_OPTS: -Xmx192m
      SPRING_SLEUTH_ENABLED: "true"
      SPRING_SLEUTH_SAMPLER_PROBABILITY: 1
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411/
