services:
  mysql:
    build: ./mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=mysqlpw
  ftgo-flyway:
    image: ftgo-flyway:dev
    build:
      context: ./ftgo-flyway
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo1.maven.org/maven2}
    depends_on:
      - mysql
    environment:
      FLYWAY_URL: jdbc:mysql://mysql/ftgo?useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: mysqluser
      FLYWAY_PASSWORD: mysqlpw
      FLYWAY_CONNECT_RETRIES: 60
    command: ["migrate"]
  ftgo-application:
    image: ftgo-application:dev
    build:
      context: .
      dockerfile: ftgo-application/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    ports:
      - "8081:8080"
    depends_on:
      ftgo-flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/ftgo?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JAVA_OPTS: -Xmx192m
