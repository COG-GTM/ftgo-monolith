services:
  mysql:
    # mysql/Dockerfile: mysql:8.0 + schema.sql that creates the `ftgo` database.
    build: ./mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=mysqluser
      - MYSQL_PASSWORD=mysqlpw
  ftgo-application:
    build: ./ftgo-application
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    environment:
      # Connector/J 8 + MySQL 8: caching_sha2_password logins over plain TCP need
      # allowPublicKeyRetrieval=true; useSSL=false silences the self-signed-cert warning.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql/ftgo?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: mysqluser
      SPRING_DATASOURCE_PASSWORD: mysqlpw
      # com.mysql:mysql-connector-j moved the driver class to the com.mysql.cj package.
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      JAVA_OPTS: -Xmx192m
