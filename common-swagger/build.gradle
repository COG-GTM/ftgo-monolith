dependencies {
    // springdoc-openapi replaces springfox on Spring Boot 3 (OpenAPI 3 + bundled Swagger UI).
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:$springdocVersion"
    api "org.springframework.boot:spring-boot-starter-web"

    // JUnit 5 + MockMvc for the smoke test that hits the springdoc endpoints.
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    // Gradle 8 no longer ships the JUnit Platform launcher on the test runtime classpath;
    // the version is managed by the Boot BOM so it stays aligned with junit-platform-engine.
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
