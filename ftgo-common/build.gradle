dependencies {
    // TODO eliminate this - problem is value objects like Money need to be embeddable.
    // TODO https://en.wikibooks.org/wiki/Java_Persistence/Embeddables#Example_of_an_Embeddable_object_XML

    compile "org.springframework.boot:spring-boot-starter-data-jpa:$springBootVersion"
    compile "org.springframework.boot:spring-boot-starter-web:$springBootVersion"

    compile group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.18.12'
    compile group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.12'
    compile 'org.apache.commons:commons-lang3:3.18.0'
    compile "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.12"

    compile "com.mysql:mysql-connector-j:$rootProject.mysqlConnectorVersion"

    testCompile "org.springframework.boot:spring-boot-starter-test:$springBootVersion"

    runtime "javax.xml.bind:jaxb-api:2.2.11"
    runtime "com.sun.xml.bind:jaxb-core:2.2.11"
    runtime "com.sun.xml.bind:jaxb-impl:2.2.11"
    runtime "javax.activation:activation:1.1.1"
}
